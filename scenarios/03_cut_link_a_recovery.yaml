name: "03_cut_link_a_recovery"
description: "Coupure brutale du Lien A, basculement sur Lien B, retablissement du Lien A avec verification de l'hysterese anti-flapping."
duration_sec: 25

link_a:
  name: "ExpressLRS"
  latency_ms: 8.0
  jitter_ms: 1.5
  loss_percent: 0.1
  bandwidth_kbps: 50
  status: "UP"

link_b:
  name: "Cellular_4G"
  latency_ms: 45.0
  jitter_ms: 12.0
  loss_percent: 1.5
  bandwidth_kbps: 5000
  status: "UP"

events:
  - time_s: 5.0
    action: "cut_link_a"
    params:
      status: "DOWN"
      loss_percent: 100.0
    description: "Coupure franche du Lien A -> Basculement immediat sur Lien B"

  - time_s: 12.0
    action: "restore_link_a"
    params:
      status: "UP"
      latency_ms: 8.0
      jitter_ms: 1.5
      loss_percent: 0.1
    description: "Retablissement du Lien A -> Armement du timer d'hysterese (2.0s)"

