version: '3.8'

services:
  vehicle:
    build:
      context: .
      dockerfile: docker/vehicle.Dockerfile
    container_name: hybridlink-vehicle
    environment:
      - VEHICLE_PORT=14560
      - TARGET_HOST=link-manager
      - TARGET_PORT=14561
      - MAVLINK_SECRET_KEY=HybridLinkSimSecretKeyHeudiasyc!
      - ENFORCE_SECURITY=true
    ports:
      - "14560:14560/udp"
    networks:
      - hybrid_net
    restart: unless-stopped

  netem:
    build:
      context: .
      dockerfile: docker/netem.Dockerfile
    container_name: hybridlink-netem
    cap_add:
      - NET_ADMIN
    environment:
      - VEHICLE_HOST=vehicle
      - VEHICLE_PORT=14560
      - LINK_A_PORT=14551
      - LINK_B_PORT=14552
      - SCENARIO=01_nominal
    ports:
      - "14551:14551/udp"
      - "14552:14552/udp"
    depends_on:
      - vehicle
    networks:
      - hybrid_net
    restart: unless-stopped

  link-manager:
    build:
      context: .
      dockerfile: docker/link_manager.Dockerfile
    container_name: hybridlink-link-manager
    environment:
      - GCS_HOST=gcs
      - GCS_PORT=14550
      - LINK_A_HOST=netem
      - LINK_A_PORT=14551
      - LINK_B_HOST=netem
      - LINK_B_PORT=14552
      - GCS_PROXY_PORT=14555
      - LINK_A_LISTEN_PORT=14561
      - LINK_B_LISTEN_PORT=14562
    ports:
      - "14555:14555/udp"
      - "14561:14561/udp"
      - "14562:14562/udp"
    depends_on:
      - netem
    networks:
      - hybrid_net
    restart: unless-stopped

  gcs:
    build:
      context: .
      dockerfile: docker/gcs.Dockerfile
    container_name: hybridlink-gcs
    environment:
      - GCS_PORT=14550
      - TARGET_HOST=link-manager
      - TARGET_PORT=14555
      - MAVLINK_SECRET_KEY=HybridLinkSimSecretKeyHeudiasyc!
      - AUTO_MISSION=true
    ports:
      - "14550:14550/udp"
    depends_on:
      - link-manager
    networks:
      - hybrid_net
    restart: unless-stopped

  attacker:
    build:
      context: .
      dockerfile: docker/attacker.Dockerfile
    container_name: hybridlink-attacker
    environment:
      - TARGET_HOST=netem
      - TARGET_PORT=14551
      - ATTACK_TYPE=spoofing
      - ATTACK_DELAY_SEC=8.0
    depends_on:
      - netem
      - vehicle
    networks:
      - hybrid_net
    profiles:
      - attack
    restart: "no"

networks:
  hybrid_net:
    driver: bridge
