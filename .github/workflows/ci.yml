name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check src tests

      - name: Static Type Checking with Mypy
        run: python -m mypy src tests

  test-and-evaluate:
    name: Automated Tests & Monte Carlo Evaluation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite (Unit & Integration)
        run: python -m pytest -v --cov=src --cov-report=term-missing tests/

      - name: Run Monte Carlo Scientific Campaign (N=30)
        run: python -m src.metrics.main --runs 30

      - name: Verify Artifacts Generation
        run: |
          test -f data/metrics/monte_carlo_runs.csv
          test -f data/reports/summary_metrics.md
          test -f data/plots/01_latency_timeline_failover.png
          test -f data/plots/02_latency_percentiles.png
          test -f data/plots/03_security_comparison.png
          test -f data/plots/04_failover_recovery_distribution.png
